<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSIS</title>
<style>
/* One colour per thing: searchers, the method writer, the judge, our score, plain search, kept and dropped. */
:root{
  --bg:#060606;--panel:#0c0c0c;--line:#202020;--edge:#383838;--fg:#e6e6e6;--muted:#8c8c8c;--dim:#585858;
  --search:#35c9ff;--writer:#ffd23f;--judge:#c77dff;--ours:#3ddc84;--base:#ff8a3d;--good:#3ddc84;--bad:#ff5a52;
  --display:ABCAreal,"Inter","Helvetica Neue",system-ui,sans-serif;--mono:ABCArealMono,"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:10px 12px;background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto auto 1fr;gap:8px;overflow:hidden}
.panel{border:1px solid var(--edge);background:var(--panel);padding:12px 14px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.label{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;flex:none}
#question{font:600 26px/1.25 var(--display);color:#fff;letter-spacing:-.02em}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{border:1px solid var(--edge);background:var(--bg);color:var(--muted);padding:5px 14px;cursor:pointer;font:500 14px var(--mono);border-radius:0}
.tab:hover{color:#fff;border-color:#fff}
.tab.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.tab b{font-weight:700;color:var(--ours)}.tab.on b{color:#000}
.tab i{font-style:normal;color:var(--search)}

#lights{flex-direction:row;gap:28px;align-items:center;flex-wrap:wrap;padding:10px 14px}
#lights strong{font:700 16px var(--display);letter-spacing:.08em;color:#fff}
.light{display:flex;gap:9px;align-items:center;font-size:15px;font-weight:600;color:#fff}
.light i{width:13px;height:13px;background:var(--c);box-shadow:0 0 10px var(--c);animation:pulse 1.4s ease-in-out infinite}
.light.off{color:var(--dim);font-weight:400}.light.off i{background:#2a2a2a;box-shadow:none;animation:none}
.light.alert{margin-left:auto;color:var(--bad)}

.main{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
svg.fit{display:block;width:100%;flex:1;min-height:0}
.blk rect{fill:#0c0c0c;stroke:#7a7a7a;stroke-width:1.8;transition:fill .25s,stroke .25s}
.blk text{fill:#e6e6e6;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.blk.entry rect{stroke:#fff;stroke-width:2.6}
.blk.active rect{fill:var(--c,#fff);stroke:var(--c,#fff);filter:drop-shadow(0 0 10px var(--c,#fff))}
.blk.active text{fill:#000;font-weight:700}
#b-thinking,#b-writing,#b-web_search,#b-fetch_pages,#b-check_candidates,#b-history,#b-submit{--c:var(--search)}
#b-scoring,#b-judging{--c:var(--judge)}
#b-done{--c:var(--good)}
.blk .badge{fill:#fff;stroke:#000;stroke-width:1.5;filter:none;display:none}
.blk.many .badge{display:block}
.blk .count,.blk.active .count{fill:#000;font-size:13px;font-weight:700}
.dot{fill:#fff;filter:drop-shadow(0 0 6px currentColor)}
.edge path{fill:none;stroke:#6f6f6f;stroke-width:1.5;transition:stroke .2s}
.edge text{fill:#8c8c8c;font-size:10px;text-anchor:middle}
.edge.hot path{stroke:#fff;stroke-width:3}
.edge.hot text{fill:#fff}
.region{fill:#8c8c8c;font-size:11px;letter-spacing:.14em;font-weight:600}

#stats{display:flex;gap:26px;flex-wrap:wrap;flex:none}
#stats div{color:var(--muted);font-size:12px}
#stats b{display:block;font:700 32px/1.1 var(--display);color:#fff;letter-spacing:-.02em}
#stats .ours b{color:var(--ours)}#stats .base b{color:var(--base)}#stats .up b{color:var(--good)}#stats .down b{color:var(--bad)}
details{position:absolute;right:12px;top:10px;border:1px solid var(--edge);background:var(--bg);padding:6px 10px;font-size:12px;z-index:2}
summary{cursor:pointer;color:var(--muted)}
details div{display:flex;gap:8px;align-items:center;margin-top:4px}
.sw{width:24px;height:0;border-top:3px solid var(--ours)}.sw.base{border-top:3px dashed var(--base)}.sw.fill{height:10px;border:0;background:#3ddc8440}
#methods{flex:none;border-top:1px solid var(--line);padding-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.method{border:1px solid var(--edge);padding:3px 10px;font:600 14px var(--display);color:#fff}
.method small{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
.method.dropped{color:var(--dim);text-decoration:line-through;border-color:var(--line)}.method.dropped small{color:var(--bad);text-decoration:none;display:inline-block}
.method.kept small{color:var(--good)}
.method.used{border-color:var(--ours);box-shadow:0 0 10px #3ddc8455}.method.used small{color:var(--ours)}
.method.trying{border-color:var(--writer)}.method.trying small{color:var(--writer);animation:pulse 1.2s ease-in-out infinite}
.method.new{animation:arrive 1.6s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(10px);box-shadow:0 0 24px #fff}}
.land{animation:land 1.6s ease-out}
@keyframes land{from{opacity:0;r:22}}
@keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>

<div class="panel">
  <div class="label">Question</div>
  <div id="question">…</div>
  <div id="tabs"></div>
</div>

<div class="panel" id="lights"></div>

<div class="main">
  <div class="panel">
    <div class="label" title="Top row: the loop, read from the files the run has written. Below: each agent's token replays the steps in its own event stream.">What is happening now</div>
    <svg class="fit" id="machine" viewBox="0 0 990 462"></svg>
  </div>
  <div class="panel">
    <div class="label">Score, same search budget</div>
    <div id="stats"></div>
    <details open><summary>Legend</summary>
      <div><span class="sw"></span>Ours</div><div><span class="sw base"></span>Plain search</div><div><span class="sw fill"></span>Ahead of plain search</div>
    </details>
    <svg class="fit" id="chart" viewBox="0 0 900 400"></svg>
    <div id="methods"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v) => (v == null ? "–" : Math.round(v * 100) + "%");
const pretty = (name) => name.replaceAll("_", " ");
const methodName = (id) => (id === "v000" ? "plain search" : /^v\d+$/.test(id) ? "method " + Number(id.slice(1)) : id);
const view = new URLSearchParams(location.search);   // task: one question, else every unseen question; run: a named run, else the latest
const put = (el, html) => { if (el.dataset.html !== html) el.innerHTML = el.dataset.html = html; };   // unchanged parts stay put: clicks land, arrivals animate once
let knownMethods = null;

// The state machine. Blocks are states, arrows are transitions; [x, y, label, width]. A null label is a junction dot.
const W = 96, H = 32;
const STATES = {
  start: [62, 58, "start"], calibrate: [206, 58, "calibrate"], train: [350, 58, "train"], improve: [494, 58, "improve"],
  select: [638, 58, "select"], test: [782, 58, "test"], tally: [926, 58, "tally"], trial: [206, 112, "trial"],
  begin: [36, 259, null], thinking: [150, 259, "thinking"], writing: [310, 259, "writing call"],
  web_search: [500, 196, "web_search", 140], fetch_pages: [500, 238, "fetch_pages", 140],
  check_candidates: [500, 280, "check_candidates", 140], history: [500, 322, "history", 140],
  result: [650, 259, null], submit: [500, 404, "submit / propose", 140], scoring: [676, 404, "key match"], judging: [810, 404, "judge"], done: [936, 404, "done", 76],
};
// [from, to, label, shape]: a number shifts a two-way pair apart; an object gives the curve and where its label sits.
const EDGES = [
  ["start", "calibrate", ""], ["start", "trial", ""], ["calibrate", "train", ""],
  ["train", "improve", "scored"], ["improve", "select", "methods"], ["select", "test", "winner"],
  ["test", "tally", "scored"], ["tally", "train", "next iteration", { d: "M926 42C926 8 350 8 350 42", at: [638, 12] }],
  ["begin", "thinking", ""], ["thinking", "writing", ""],
  ["writing", "web_search", ""], ["writing", "fetch_pages", ""], ["writing", "check_candidates", ""], ["writing", "history", ""],
  ["web_search", "result", ""], ["fetch_pages", "result", ""], ["check_candidates", "result", ""], ["history", "result", ""],
  ["result", "thinking", "result, next turn", { d: "M650 253C650 130 150 130 150 243", at: [400, 152] }],
  ["writing", "submit", ""], ["submit", "scoring", "finds"], ["scoring", "judging", ""], ["judging", "done", "score"],
  ["scoring", "done", "all in answer key", { d: "M676 388C676 356 936 356 936 388", at: [806, 358] }],
  ["submit", "done", "proposal (improver)", { d: "M500 420C500 456 936 456 936 420", at: [718, 458] }],
];
const LOOP = new Set(["start", "calibrate", "train", "improve", "select", "test", "tally", "trial"]);
const NS = "http://www.w3.org/2000/svg";
const tokens = new Map();        // "loop" and one per agent: { at, dot, chain, played, waiting }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let built = false;

function border(id, toward) {    // where the line from a state's centre toward a point leaves its block
  const [x, y, label, w] = STATES[id], hw = label == null ? 6 : (w || W) / 2, hh = label == null ? 6 : H / 2;
  const dx = toward[0] - x, dy = toward[1] - y;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [x + dx * t, y + dy * t];
}

function build() {
  let out = `<defs>` + [["tip", "#6f6f6f"], ["tipHot", "#fff"]].map(([id, c]) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join("") + `</defs>` +
    `<text class="region" x="14" y="18">LOOP</text><text class="region" id="region-agents" x="14" y="176">AGENTS</text>` +
    `<text class="region" id="judge-total" x="810" y="436" text-anchor="middle"></text>`;
  for (const [from, to, label, shape] of EDGES) {
    const a = STATES[from], b = STATES[to];
    let d, lx, ly;
    if (shape && shape.d) {
      d = shape.d; [lx, ly] = shape.at;
    } else {
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]), off = shape || 0;
      const nx = (-(b[1] - a[1]) / len) * off, ny = ((b[0] - a[0]) / len) * off;       // sideways shift for two-way pairs
      const p = border(from, [b[0], b[1]]), q = border(to, [a[0], a[1]]);
      d = `M${p[0] + nx} ${p[1] + ny}L${q[0] + nx} ${q[1] + ny}`;
      lx = (p[0] + q[0]) / 2 + nx; ly = (p[1] + q[1]) / 2 + ny - 6;
    }
    out += `<g class="edge" id="e-${from}-${to}"><path d="${d}" marker-end="url(#tip)"/>` + (label ? `<text x="${lx}" y="${ly}">${label}</text>` : "") + `</g>`;
  }
  for (const [id, [x, y, label, w = W]] of Object.entries(STATES)) {
    if (label == null) { out += `<circle cx="${x}" cy="${y}" r="5" fill="#d8d8d8"/>`; continue; }
    out += `<g class="blk ${id === "start" ? "entry" : ""}" id="b-${id}"><rect x="${x - w / 2}" y="${y - H / 2}" width="${w}" height="${H}"/><text class="name" x="${x}" y="${y}">${label}</text>` +
      `<rect class="badge" x="${x + w / 2 - 9}" y="${y - H / 2 - 9}" width="18" height="18"/><text class="count" x="${x + w / 2}" y="${y - H / 2}"></text></g>`;
  }
  $("machine").innerHTML = out + `<g id="dots"></g>`;
  built = true;
}

// The loop state is read from files, so a change the poll missed is walked along the drawn arrows.
function route(from, to) {
  const queue = [[from]], done = new Set([from]);
  while (queue.length) {
    const path = queue.shift(), at = path[path.length - 1];
    if (at === to) return path;
    for (const [f, t] of EDGES) if (f === at && LOOP.has(t) && !done.has(t)) { done.add(t); queue.push([...path, t]); }
  }
  return null;
}

function paint() {               // blocks are lit by the tokens resting on them
  const counts = {};
  for (const [key, tk] of tokens) if (tk.at) (counts[tk.at] ||= { n: 0, loop: false }), key === "loop" ? (counts[tk.at].loop = true) : counts[tk.at].n++;
  for (const id of Object.keys(STATES)) {
    const el = $("b-" + id);
    if (!el) continue;
    const c = counts[id];
    el.classList.toggle("active", !!c);
    el.classList.toggle("many", !!c && c.n > 1);
    el.querySelector(".count").textContent = c && c.n > 1 ? c.n : "";
  }
}

function hop(tk, from, to, ms) { // slide the token's dot along one arrow
  return new Promise((done) => {
    const edge = $(`e-${from}-${to}`), path = edge.querySelector("path"), len = path.getTotalLength(), t0 = performance.now();
    edge.classList.add("hot"); path.setAttribute("marker-end", "url(#tipHot)");
    tk.at = null; tk.dot.style.display = ""; paint();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k), pt = path.getPointAtLength(len * e);
      tk.dot.setAttribute("cx", pt.x); tk.dot.setAttribute("cy", pt.y);
      if (k < 1) return requestAnimationFrame(step);
      edge.classList.remove("hot"); path.setAttribute("marker-end", "url(#tip)");
      tk.dot.style.display = "none"; tk.at = to; paint(); done();
    };
    requestAnimationFrame(step);
  });
}

function token(key, at) {
  let tk = tokens.get(key);
  if (!tk) {
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("r", 6); dot.setAttribute("class", "dot"); dot.style.display = "none";
    $("dots").appendChild(dot);
    tokens.set(key, (tk = { at, target: at, dot, chain: Promise.resolve(), played: 0, waiting: 0 }));
  }
  return tk;
}

function step(tk, to) {          // queue one transition; a token that falls behind its agent moves faster
  tk.waiting++;
  tk.chain = tk.chain.then(async () => {
    const from = tk.at;
    if (from !== to) {
      if (from && $(`e-${from}-${to}`)) await hop(tk, from, to, tk.waiting > 3 ? 160 : 420);
      else { tk.at = STATES[to] ? to : null; paint(); await sleep(120); }
    }
    tk.waiting--;
  });
}

function machine(s) {
  const first = !built;
  if (first) build();
  const phase = (s.phase || "").split(" ")[0], at = STATES[phase] ? phase : null;
  const loop = token("loop", first ? at : null);
  if (loop.target !== at) {
    const path = loop.target && at ? route(loop.target, at) : null;
    loop.target = at;
    for (const to of path ? path.slice(1) : [at]) step(loop, to);
  }
  const live = new Set();
  for (const a of s.agents) {
    if (!a.recent) continue;
    live.add(a.id);
    let tk = tokens.get(a.id);
    if (!tk) {                   // seen mid-run or already finished: place it where it is, then follow from there
      const catchUp = first || !a.running;
      tk = token(a.id, catchUp ? a.path[a.path.length - 1] || null : "begin");
      tk.played = catchUp ? a.path.length : 0;
      tk.dot.style.fill = a.role === "improver" ? "var(--writer)" : "var(--search)";
    }
    while (tk.played < a.path.length) step(tk, a.path[tk.played++]);
  }
  for (const [key, tk] of tokens) {
    if (key === "loop" || live.has(key) || tk.leaving) continue;
    tk.leaving = true;
    tk.chain = tk.chain.then(() => { tk.dot.remove(); tokens.delete(key); paint(); });
  }
  paint();
  const running = s.agents.filter((a) => a.running).length;
  $("region-agents").textContent = "AGENTS" + (running ? ` · ${running} running` : "");
  const judging = s.agents.filter((a) => a.state === "judging" && a.judge);
  $("judge-total").textContent = judging.length ? `${judging.reduce((n, a) => n + a.judge.checked, 0)}/${judging.reduce((n, a) => n + a.judge.to_check, 0)} checked` : "";
}


function lights(s) {
  const running = s.agents.filter((a) => a.running);
  const searching = running.filter((a) => a.role !== "improver" && !["scoring", "judging"].includes(a.state)).length;
  const writing = running.some((a) => a.role === "improver");
  const judged = s.agents.filter((a) => a.judge && !a.judge.done);
  const checked = judged.reduce((n, a) => n + a.judge.checked, 0), toCheck = judged.reduce((n, a) => n + a.judge.to_check, 0);
  const light = (on, colour, text) => `<div class="light ${on ? "" : "off"}" style="--c:var(--${colour})"><i></i>${text}</div>`;
  put($("lights"), `<strong>RSIS</strong>` +
    light(searching, "search", searching ? `${searching} searching` : "searchers") +
    light(writing, "writer", writing ? "writing new methods" : "method writer") +
    light(judged.length, "judge", judged.length ? `judge ${checked} / ${toCheck}` : "judge") +
    (s.failed ? `<div class="light alert" style="--c:var(--bad)" title="${esc(s.last_error)}"><i></i>${s.failed} failed</div>` : ""));
}

// Ours against plain search. Every unseen question: one point per round. One question: one point per search of it.
function score(s) {
  const st = s.state || {}, task = s.task_searches;
  const base = task ? s.baseline : st.baseline_test;
  const points = task ? task.map((x) => ({ v: x.score, label: methodName(x.method) }))
    : [...(base == null ? [] : [{ v: base, label: "start" }]), ...(st.test_points || []).map((p) => ({ v: p.test, label: String(p.round) }))];
  const mine = task ? [...task].reverse().find((x) => x.method === st.current) || task[task.length - 1] : null;
  const ours = task ? mine && mine.score : points.length ? points[points.length - 1].v : null;
  const gap = ours == null || base == null ? null : Math.round((ours - base) * 100);
  put($("stats"),
    `<div class="ours"><b>${pct(ours)}</b>Ours${mine ? ` · ${mine.correct} of ${mine.total}` : ""}</div>` +
    `<div class="base"><b>${pct(base)}</b>Plain search</div>` +
    `<div class="${gap > 0 ? "up" : gap < 0 ? "down" : ""}"><b>${gap == null ? "–" : (gap > 0 ? "+" : "") + gap}</b>points</div>` +
    `<div><b>${esc(methodName(st.current || "v000"))}</b>in use</div>` +
    `<div><b>${s.searches_done}</b>searches</div><div><b>$${Number(s.spend).toFixed(2)}</b>spent</div>`);

  const L = 60, R = 860, T = 30, B = 340, n = Math.max(5, points.length);
  const x = (i) => L + (i + 0.5) * (R - L) / n, y = (v) => B - (B - T) * Math.max(0, Math.min(1, v));
  let out = "";
  for (const v of [0, 0.25, 0.5, 0.75, 1])
    out += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="#202020"/><text x="${L - 10}" y="${y(v) + 5}" fill="#8c8c8c" font-size="13" text-anchor="end">${v * 100}%</text>`;
  out += `<text x="${L}" y="${T - 12}" fill="#585858" font-size="12">100% = every answer found, none wrong</text>`;
  if (base != null) {
    if (points.length > 1)
      out += `<polygon points="${points.map((p, i) => `${x(i)},${y(Math.max(p.v, base))}`).join(" ")} ${x(points.length - 1)},${y(base)} ${x(0)},${y(base)}" fill="#3ddc8440"/>`;
    out += `<line x1="${L}" x2="${R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--base)" stroke-width="3" stroke-dasharray="9 7"/>` +
      `<text x="${R}" y="${y(base) + 20}" fill="var(--base)" font-size="15" font-weight="700" text-anchor="end">Plain search ${pct(base)}</text>`;
  }
  if (points.length > 1) out += `<polyline points="${points.map((p, i) => `${x(i)},${y(p.v)}`).join(" ")}" fill="none" stroke="var(--ours)" stroke-width="4" stroke-linejoin="round"/>`;
  points.forEach((p, i) => {
    const last = i === points.length - 1;
    out += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${last ? 9 : 6}" fill="var(--ours)" ${last ? 'class="land"' : ""}/>` +
      `<text x="${x(i)}" y="${y(p.v) - 16}" fill="#fff" font-size="${last ? 18 : 13}" font-weight="700" text-anchor="middle">${last && !task ? "Ours " : ""}${pct(p.v)}</text>` +
      `<text x="${x(i)}" y="${B + 22}" fill="#8c8c8c" font-size="12" text-anchor="middle">${esc(p.label)}</text>`;
  });
  if (!task) out += `<text x="${(L + R) / 2}" y="${B + 44}" fill="#585858" font-size="12" text-anchor="middle">round</text>`;
  put($("chart"), out);
}

function methods(s) {
  const current = (s.state || {}).current;
  const state = (m) => m.id === current ? ["used", "in use"] : m.status === "discarded" ? ["dropped", "dropped"] : m.status === "candidate" ? ["trying", "trying"] : ["kept", "kept"];
  const list = s.methods.filter((m) => m.id !== "v000" && m.status !== "recursion-test"), shown = list.slice(-6);
  const fresh = knownMethods ? new Set(list.filter((m) => !knownMethods.has(m.id)).map((m) => m.id)) : new Set();
  put($("methods"), `<span class="label" style="margin:0">Methods tried</span>` + (list.length > shown.length ? `<span style="color:var(--dim)">+${list.length - shown.length} earlier</span>` : "") +
    (shown.map((m) => { const [c, text] = state(m); return `<span class="method ${c} ${fresh.has(m.id) ? "new" : ""}"><small>${text}</small>${esc(methodName(m.id))}</span>`; }).join("") || `<span style="color:var(--dim)">none yet</span>`));
  knownMethods = new Set(list.map((m) => m.id));
}

function render(s) {
  if (!s.name) { put($("question"), "No run yet"); return; }
  const tab = (name, label) => `<button class="tab ${(s.task || "") === name ? "on" : ""}" data-task="${esc(name)}">${label}</button>`;
  put($("tabs"), tab("", "All unseen questions") + s.tasks.map((t) => {
    const best = Math.max(-1, ...t.searches.map((x) => x.score));
    return tab(t.name, esc(pretty(t.name)) + (t.running ? ` <i>●</i>` : "") + (best >= 0 ? ` <b>${pct(best)}</b>` : ""));
  }).join(""));
  const t = s.tasks.find((x) => x.name === s.task);
  put($("question"), esc(t ? t.question : "Average over the questions the method never trained on"));
  lights(s); machine(s); score(s); methods(s);
}

async function poll() {
  const r = await fetch(`/api/run?name=${encodeURIComponent(view.get("run") || "")}&task=${encodeURIComponent(view.get("task") || "")}`);
  render(await r.json());
}
$("tabs").onclick = (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  b.dataset.task ? view.set("task", b.dataset.task) : view.delete("task");
  history.replaceState(null, "", "?" + view);
  poll().catch(() => {});
};
poll();
setInterval(() => poll().catch(() => {}), 500);
</script>

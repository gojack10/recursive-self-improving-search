<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rsis live view</title>
<style>
/* Palette, status colours and status pips follow the SiftText landing page. */
:root{
  --bg:#060606;--panel:#0c0c0c;--line:#202020;--edge:#383838;--fg:#d8d8d8;--bright:#fff;--muted:#8c8c8c;--dim:#585858;
  --in_progress:#5a8cc7;--resolved:#6b9b7a;--discarded:#4a4a4a;--not_examined:#8a8a8a;--urgent:#b85450;
  --display:ABCAreal,system-ui,sans-serif;--mono:ABCArealMono,"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:10px 12px;background:var(--bg);color:var(--fg);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto auto 1fr;gap:8px;overflow:hidden}
h1{margin:0;color:#fff;font:500 18px/24px var(--display);letter-spacing:-.03em}
h2{margin:0 0 6px;color:var(--muted);font:400 10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase;flex:none}
.top{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.stat{color:var(--muted)}
.stat b{color:#fff;font-weight:500}
#error{color:var(--urgent)}
select{background:var(--panel);color:#fff;border:1px solid var(--edge);font:inherit;padding:1px 4px;border-radius:0}
#tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap}
.tab{flex:none;border:1px solid var(--edge);background:var(--panel);color:var(--muted);padding:2px 10px;cursor:pointer;font:inherit;border-radius:0}
.tab.on{background:#fff;color:#000;border-color:#fff}
.tab .live{color:var(--in_progress)}
.tab.on .live{color:#000}
#about{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
#about b{color:#fff;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
.panel{border:1px solid var(--edge);background:var(--panel);padding:10px 12px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.fill{flex:1;min-height:0;overflow:auto}

.blk rect{fill:#0c0c0c;stroke:#6f6f6f;stroke-width:1.2;transition:fill .25s,stroke .25s}
.blk text{fill:#d8d8d8;font-size:12px;text-anchor:middle;dominant-baseline:central}
.blk.entry rect{stroke:#d8d8d8;stroke-width:2.4}
.blk.active rect{fill:#fff;stroke:#fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}
.blk.active text{fill:#000}
.blk .badge{fill:var(--in_progress);stroke:none;filter:none;display:none}
.blk.many .badge{display:block}
.dot{fill:#fff;filter:drop-shadow(0 0 6px #fff)}
.blk .count{fill:#000;font-size:11px}
.edge path{fill:none;stroke:#6f6f6f;stroke-width:1.2;transition:stroke .2s}
.edge text{fill:#8c8c8c;font-size:10px;text-anchor:middle}
.edge.hot path{stroke:#fff;stroke-width:2.4}
.edge.hot text{fill:#fff}
.region{fill:#585858;font-size:10px;letter-spacing:.14em}
svg.chart{display:block;width:100%;height:100%;flex:1;min-height:0}

#agents{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.agent{border:1px solid var(--line);min-height:0;min-width:0;display:flex;flex-direction:column;background:#080808}
.agent.idle{opacity:.55}
.agent .head{flex:none;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.agent .head div{overflow:hidden;text-overflow:ellipsis}
.agent .role{color:#fff;letter-spacing:.12em;text-transform:uppercase}
.agent .chip{float:right;padding:0 6px;color:#000;background:var(--in_progress)}
.agent .chip.scoring,.agent .chip.judging{background:#b8853d}.agent .chip.done{background:var(--resolved)}.agent .chip.stalled{background:var(--urgent)}
.agent .sub{color:var(--muted)}
.agent .log{flex:1;min-height:0;overflow:auto;padding:4px 8px;font-size:11px;line-height:1.45;word-break:break-word}
.log .turn{color:var(--dim);border-top:1px solid var(--line);margin-top:3px}
.log .think{color:var(--muted);font-style:italic}
.log .say{color:var(--fg)}
.log .call{color:#fff}
.log .result{color:var(--resolved)}
.log .hit{color:var(--dim);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .error{color:var(--urgent)}
.log .judge{color:#b8853d;border-top:1px solid var(--line);margin-top:3px}
.log .verdict{color:#c9a56a}
.log .live{color:var(--in_progress)}
.log .live::after{content:"▍";animation:pulse 1s steps(2) infinite}
.quiet,.empty{color:var(--dim)}

.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{margin-left:13px}
.tree ul ul>li{position:relative;padding-left:22px}
.tree ul ul>li::before{content:'';position:absolute;left:0;top:0;height:14px;width:16px;border-left:1px solid #3a3a3a;border-bottom:1px solid #3a3a3a}
.tree ul ul>li::after{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1px solid #3a3a3a}
.tree ul ul>li:last-child::after{display:none}
.tree .node{display:flex;gap:8px;align-items:center;padding:2px 0}
.pip{flex:none;width:28px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2}
.tree .kind{flex:none;color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tree .label{color:#c8c8c8;font:500 14px/20px var(--display)}
.tree .score{color:var(--muted)}
.tree .discarded>.node .label{color:var(--dim)}
.tree .new>.node{animation:grow .8s ease-out}
.tree .new>.node .label{color:#fff}
@keyframes grow{from{opacity:0;transform:translateY(-10px)}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>

<div class="top">
  <h1>rsis live view</h1>
  <span class="stat">run <select id="run"></select></span>
  <span class="stat">loop <b id="phase">…</b></span>
  <span class="stat">current method <b id="current">…</b></span>
  <span class="stat">best test <b id="best">…</b></span>
  <span class="stat">searches <b id="done">…</b></span>
  <span class="stat">Telem <b id="spend">…</b></span>
  <span id="error"></span>
</div>

<div>
  <div id="tabs"></div>
  <div id="about"></div>
</div>

<div class="grid">
  <div class="panel">
    <h2 title="Loop row: read from the files the run has written. Agent rows: each token replays the transitions in that agent's Pi event stream, in order.">Active state</h2>
    <svg class="chart" id="machine" viewBox="0 0 990 462"></svg>
  </div>
  <div class="panel tree">
    <h2>Run tree</h2>
    <div class="fill" id="tree"></div>
  </div>
  <div class="panel">
    <h2>Agents</h2>
    <div id="agents"></div>
  </div>
  <div class="panel">
    <h2 title="Line: each iteration's winner re-run on the fixed held-out test tasks. Dots left of a column: that iteration's candidates at their score on its two select tasks; the tick is the current method on the same two tasks. The two are different task sets.">Method iterations</h2>
    <svg class="chart" id="chart" viewBox="0 0 900 420"></svg>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 2) => (v == null ? "–" : Number(v).toFixed(d));
const FRAME = "M5 2H2v12h3m10-12h3v12h-3";
const GLYPH = { in_progress: "M6 9c2-5 6 4 8-2", resolved: "M6 8l3 3 5-7", discarded: "m-8-9 6 6m0-6-6 6", not_examined: "" };
const view = new URLSearchParams(location.search);   // run: a chosen run, else follow the latest; task: one question, else the whole run
const choose = (key, value) => {
  value ? view.set(key, value) : view.delete(key);
  if (key === "run") view.delete("task");
  history.replaceState(null, "", "?" + view);
  poll().catch(() => {});
};
let seen = null;

// The state machine. Blocks are states, arrows are transitions; [x, y, label, width]. A null label is a junction dot.
const W = 96, H = 32;
const STATES = {
  start: [62, 58, "start"], calibrate: [206, 58, "calibrate"], train: [350, 58, "train"], improve: [494, 58, "improve"],
  select: [638, 58, "select"], test: [782, 58, "test"], tally: [926, 58, "tally"], trial: [206, 112, "trial"],
  begin: [36, 259, null], thinking: [150, 259, "thinking"], writing: [310, 259, "writing call"],
  web_search: [500, 196, "web_search", 140], fetch_pages: [500, 238, "fetch_pages", 140],
  check_candidates: [500, 280, "check_candidates", 140], history: [500, 322, "history", 140],
  result: [650, 259, null], submit: [500, 404, "submit / propose", 140], scoring: [676, 404, "key match"], judging: [810, 404, "judge"], done: [936, 404, "done", 76],
};
// [from, to, label, shape]: a number shifts a two-way pair apart; an object gives the curve and where its label sits.
const EDGES = [
  ["start", "calibrate", ""], ["start", "trial", ""], ["calibrate", "train", ""],
  ["train", "improve", "scored"], ["improve", "select", "methods"], ["select", "test", "winner"],
  ["test", "tally", "scored"], ["tally", "train", "next iteration", { d: "M926 42C926 8 350 8 350 42", at: [638, 12] }],
  ["begin", "thinking", ""], ["thinking", "writing", ""],
  ["writing", "web_search", ""], ["writing", "fetch_pages", ""], ["writing", "check_candidates", ""], ["writing", "history", ""],
  ["web_search", "result", ""], ["fetch_pages", "result", ""], ["check_candidates", "result", ""], ["history", "result", ""],
  ["result", "thinking", "result, next turn", { d: "M650 253C650 130 150 130 150 243", at: [400, 152] }],
  ["writing", "submit", ""], ["submit", "scoring", "finds"], ["scoring", "judging", ""], ["judging", "done", "score"],
  ["scoring", "done", "all in answer key", { d: "M676 388C676 356 936 356 936 388", at: [806, 358] }],
  ["submit", "done", "proposal (improver)", { d: "M500 420C500 456 936 456 936 420", at: [718, 458] }],
];
const LOOP = new Set(["start", "calibrate", "train", "improve", "select", "test", "tally", "trial"]);
const NS = "http://www.w3.org/2000/svg";
const tokens = new Map();        // "loop" and one per agent: { at, dot, chain, played, waiting }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let built = false;

function border(id, toward) {    // where the line from a state's centre toward a point leaves its block
  const [x, y, label, w] = STATES[id], hw = label == null ? 6 : (w || W) / 2, hh = label == null ? 6 : H / 2;
  const dx = toward[0] - x, dy = toward[1] - y;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [x + dx * t, y + dy * t];
}

function build() {
  let out = `<defs>` + [["tip", "#6f6f6f"], ["tipHot", "#fff"]].map(([id, c]) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join("") + `</defs>` +
    `<text class="region" x="14" y="18">LOOP</text><text class="region" id="region-agents" x="14" y="176">AGENTS</text>` +
    `<text class="region" id="judge-total" x="810" y="436" text-anchor="middle"></text>`;
  for (const [from, to, label, shape] of EDGES) {
    const a = STATES[from], b = STATES[to];
    let d, lx, ly;
    if (shape && shape.d) {
      d = shape.d; [lx, ly] = shape.at;
    } else {
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]), off = shape || 0;
      const nx = (-(b[1] - a[1]) / len) * off, ny = ((b[0] - a[0]) / len) * off;       // sideways shift for two-way pairs
      const p = border(from, [b[0], b[1]]), q = border(to, [a[0], a[1]]);
      d = `M${p[0] + nx} ${p[1] + ny}L${q[0] + nx} ${q[1] + ny}`;
      lx = (p[0] + q[0]) / 2 + nx; ly = (p[1] + q[1]) / 2 + ny - 6;
    }
    out += `<g class="edge" id="e-${from}-${to}"><path d="${d}" marker-end="url(#tip)"/>` + (label ? `<text x="${lx}" y="${ly}">${label}</text>` : "") + `</g>`;
  }
  for (const [id, [x, y, label, w = W]] of Object.entries(STATES)) {
    if (label == null) { out += `<circle cx="${x}" cy="${y}" r="5" fill="#d8d8d8"/>`; continue; }
    out += `<g class="blk ${id === "start" ? "entry" : ""}" id="b-${id}"><rect x="${x - w / 2}" y="${y - H / 2}" width="${w}" height="${H}"/><text class="name" x="${x}" y="${y}">${label}</text>` +
      `<rect class="badge" x="${x + w / 2 - 9}" y="${y - H / 2 - 9}" width="18" height="18"/><text class="count" x="${x + w / 2}" y="${y - H / 2}"></text></g>`;
  }
  $("machine").innerHTML = out + `<g id="dots"></g>`;
  built = true;
}

// The loop state is read from files, so a change the poll missed is walked along the drawn arrows.
function route(from, to) {
  const queue = [[from]], done = new Set([from]);
  while (queue.length) {
    const path = queue.shift(), at = path[path.length - 1];
    if (at === to) return path;
    for (const [f, t] of EDGES) if (f === at && LOOP.has(t) && !done.has(t)) { done.add(t); queue.push([...path, t]); }
  }
  return null;
}

function paint() {               // blocks are lit by the tokens resting on them
  const counts = {};
  for (const [key, tk] of tokens) if (tk.at) (counts[tk.at] ||= { n: 0, loop: false }), key === "loop" ? (counts[tk.at].loop = true) : counts[tk.at].n++;
  for (const id of Object.keys(STATES)) {
    const el = $("b-" + id);
    if (!el) continue;
    const c = counts[id];
    el.classList.toggle("active", !!c);
    el.classList.toggle("many", !!c && c.n > 1);
    el.querySelector(".count").textContent = c && c.n > 1 ? c.n : "";
  }
}

function hop(tk, from, to, ms) { // slide the token's dot along one arrow
  return new Promise((done) => {
    const edge = $(`e-${from}-${to}`), path = edge.querySelector("path"), len = path.getTotalLength(), t0 = performance.now();
    edge.classList.add("hot"); path.setAttribute("marker-end", "url(#tipHot)");
    tk.at = null; tk.dot.style.display = ""; paint();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k), pt = path.getPointAtLength(len * e);
      tk.dot.setAttribute("cx", pt.x); tk.dot.setAttribute("cy", pt.y);
      if (k < 1) return requestAnimationFrame(step);
      edge.classList.remove("hot"); path.setAttribute("marker-end", "url(#tip)");
      tk.dot.style.display = "none"; tk.at = to; paint(); done();
    };
    requestAnimationFrame(step);
  });
}

function token(key, at) {
  let tk = tokens.get(key);
  if (!tk) {
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("r", 6); dot.setAttribute("class", "dot"); dot.style.display = "none";
    $("dots").appendChild(dot);
    tokens.set(key, (tk = { at, target: at, dot, chain: Promise.resolve(), played: 0, waiting: 0 }));
  }
  return tk;
}

function step(tk, to) {          // queue one transition; a token that falls behind its agent moves faster
  tk.waiting++;
  tk.chain = tk.chain.then(async () => {
    const from = tk.at;
    if (from !== to) {
      if (from && $(`e-${from}-${to}`)) await hop(tk, from, to, tk.waiting > 3 ? 160 : 420);
      else { tk.at = STATES[to] ? to : null; paint(); await sleep(120); }
    }
    tk.waiting--;
  });
}

function machine(s) {
  const first = !built;
  if (first) build();
  const phase = (s.phase || "").split(" ")[0], at = STATES[phase] ? phase : null;
  const loop = token("loop", first ? at : null);
  if (loop.target !== at) {
    const path = loop.target && at ? route(loop.target, at) : null;
    loop.target = at;
    for (const to of path ? path.slice(1) : [at]) step(loop, to);
  }
  const live = new Set();
  for (const a of s.agents) {
    if (!a.recent) continue;
    live.add(a.id);
    let tk = tokens.get(a.id);
    if (!tk) {                   // seen mid-run or already finished: place it where it is, then follow from there
      const catchUp = first || !a.running;
      tk = token(a.id, catchUp ? a.path[a.path.length - 1] || null : "begin");
      tk.played = catchUp ? a.path.length : 0;
    }
    while (tk.played < a.path.length) step(tk, a.path[tk.played++]);
  }
  for (const [key, tk] of tokens) {
    if (key === "loop" || live.has(key) || tk.leaving) continue;
    tk.leaving = true;
    tk.chain = tk.chain.then(() => { tk.dot.remove(); tokens.delete(key); paint(); });
  }
  paint();
  const running = s.agents.filter((a) => a.running).length;
  $("region-agents").textContent = "AGENTS" + (running ? ` · ${running} running` : "");
  const judging = s.agents.filter((a) => a.state === "judging" && a.judge);
  $("judge-total").textContent = judging.length ? `${judging.reduce((n, a) => n + a.judge.checked, 0)}/${judging.reduce((n, a) => n + a.judge.to_check, 0)} checked` : "";
}

const MARK = { turn: "", think: "~ ", say: "> ", call: "→ ", result: "← ", hit: "· ", error: "! ", judge: "⚖ ", verdict: "⚖ " };

function agents(s) {
  const box = $("agents"), ids = new Set(s.agents.map((a) => a.id));
  for (const el of [...box.children]) if (!ids.has(el.dataset.id)) el.remove();
  if (!s.agents.length) { box.innerHTML = `<div class="quiet" data-id="">No Pi agent has written a log in this run yet.</div>`; return; }
  for (const a of s.agents) {
    let el = box.querySelector(`[data-id="${a.id}"]`);
    if (!el) {
      el = document.createElement("div"); el.className = "agent"; el.dataset.id = a.id;
      el.innerHTML = `<div class="head"></div><div class="log"></div>`;
      box.appendChild(el);
    }
    el.classList.toggle("idle", !a.running);
    const chip = a.state === "judging" ? `judging ${a.judge.checked}/${a.judge.to_check} · ${Math.round(a.scoring_s)}s` : a.state === "scoring" ? `key match ${Math.round(a.scoring_s)}s` : a.state === "done" && a.score ? `scored ${num(a.score.score)}` : a.state;
    const facts = [`${a.turns} turns`, `${Math.round(a.agent_s)}s agent`];
    if (a.scoring_s != null && a.state === "done") facts.push(`${Math.round(a.scoring_s)}s scoring`);
    if (a.judge) facts.push(`judge ${a.judge.checked}/${a.judge.to_check} checked, ${a.judge.reused} reused`);
    if (a.left != null) facts.push(`$${num(a.left, 3)} left of $${num(a.budget, 2)}`);
    if (a.score) facts.push(`${a.score.correct} correct, ${a.score.wrong} wrong of ${a.score.total}`);
    el.querySelector(".head").innerHTML =
      `<div><span class="chip ${esc(a.state)}">${esc(chip)}</span><span class="role">${esc(a.role)}</span> ${esc(a.method || "")} <span class="sub">${esc(a.model || "model not reported yet")}</span></div>` +
      `<div class="sub" title="${esc(a.task)}">${esc(a.task)}</div><div class="sub">${esc(facts.join(" · "))}</div>`;
    if (el.dataset.v !== a.v) {
      const log = el.querySelector(".log"), stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      log.innerHTML = a.lines.map(([k, text]) => `<div class="${k}">${MARK[k] ?? ""}${esc(text)}</div>`).join("") +
        (a.live ? `<div class="live">${esc(a.live.slice(-400))}</div>` : "");
      if (stick) log.scrollTop = log.scrollHeight;
      el.dataset.v = a.v;
    }
  }
}

function tree(s) {
  if (!s.nodes.length) {
    $("tree").innerHTML = `<div class="empty">No tree in this run yet. The loop writes it (python -m rsis round); a single trial search does not.</div>`;
    return;
  }
  const by = new Map(s.nodes.map((n) => [n.id, { ...n, children: [] }])), roots = [];
  for (const n of by.values()) (n.parent && by.has(n.parent) ? by.get(n.parent).children : roots).push(n);
  const fresh = seen ? new Set(s.nodes.filter((n) => !seen.has(n.id)).map((n) => n.id)) : new Set();
  seen = new Set(s.nodes.map((n) => n.id));
  const li = (n) => {
    const status = n.status in GLYPH ? n.status : "not_examined";
    return `<li class="${status} ${fresh.has(n.id) ? "new" : ""}"><div class="node" title="${esc(n.summary)}">` +
      `<svg class="pip" viewBox="0 0 20 16" style="color:var(--${status})"><title>${esc(n.status)}</title><path d="${FRAME}${GLYPH[status]}"/></svg>` +
      `<span class="kind">${esc(n.kind)}</span><span class="label">${esc(n.name)}</span>` +
      (n.select_score != null ? `<span class="score">select ${num(n.select_score)}</span>` : "") + `</div>` +
      (n.children.length ? `<ul>${n.children.map(li).join("")}</ul>` : "") + `</li>`;
  };
  $("tree").innerHTML = `<ul>${roots.map(li).join("")}</ul>`;
}

function chart(s) {
  const st = s.state || {}, points = st.test_points || [];
  const L = 70, R = 860, T = 40, B = 360, y = (v) => B - (B - T) * Math.max(0, Math.min(1, v));
  const cols = Math.max(4, points.length, s.iteration || 0, ...s.methods.map((m) => m.round || 0));
  const step = (R - L) / cols, x = (i) => L + i * step;
  let out = "";
  for (const v of [0, 0.25, 0.5, 0.75, 1])
    out += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 1 ? "#6f6f6f" : "#202020"}" ${v === 1 ? 'stroke-dasharray="6 5"' : ""}/>` +
      `<text x="${L - 12}" y="${y(v) + 4}" fill="#585858" font-size="12" text-anchor="end">${v}</text>`;
  out += `<text x="${R}" y="${T - 10}" fill="#8c8c8c" font-size="12" text-anchor="end">1.0 = every answer found, nothing wrong</text>`;
  for (let i = 0; i <= cols; i++) out += `<text x="${x(i)}" y="${B + 24}" fill="#585858" font-size="12" text-anchor="middle">${i === 0 ? "seed" : i}</text>`;
  out += `<text x="${(L + R) / 2}" y="${B + 48}" fill="#585858" font-size="12" text-anchor="middle">iteration</text>`;
  if (st.baseline_test != null) {
    const n = st.noise || 0;
    out += `<rect x="${L}" width="${R - L}" y="${y(st.baseline_test + n)}" height="${Math.max(1, y(st.baseline_test - n) - y(st.baseline_test + n))}" fill="#ffffff0a"/>` +
      `<line x1="${L}" x2="${R}" y1="${y(st.baseline_test)}" y2="${y(st.baseline_test)}" stroke="#8c8c8c" stroke-dasharray="2 5"/>` +
      `<text x="${R}" y="${y(st.baseline_test) - 6}" fill="#8c8c8c" font-size="12" text-anchor="end">v000 baseline ${num(st.baseline_test)} ± ${num(n)}</text>`;
  }
  // The winner's test re-run, one point per finished iteration, starting from the seed.
  const main = [{ x: x(0), y: y(st.baseline_test ?? 0), id: "v000", known: st.baseline_test != null }];
  for (const p of points) main.push({ x: x(p.round), y: y(p.test), id: p.method, known: true, adopted: p.adopted, test: p.test, breakout: p.breakout });
  // Candidates branch from the winner of the iteration before.
  for (const m of s.methods) {
    if (!m.round || m.status === "recursion-test") continue;
    const from = main[Math.min(m.round - 1, main.length - 1)], p = points.find((q) => q.round === m.round);
    const score = p && p.select ? p.select[m.id] : m.select_score;
    const cx = x(m.round) - step * 0.38, cy = score == null ? from.y : y(score);
    const colour = m.status === "adopted" || m.status === "superseded" ? "var(--resolved)" : m.status === "discarded" ? "#5a5a5a" : "var(--in_progress)";
    out += `<line x1="${from.x}" y1="${from.y}" x2="${cx}" y2="${cy}" stroke="${colour}" stroke-width="1"/>` +
      `<circle cx="${cx}" cy="${cy}" r="4" fill="${m.status === "discarded" ? "#060606" : colour}" stroke="${colour}" class="${m.status === "candidate" ? "pulse" : ""}"><title>${esc(m.id)} ${esc(m.status)}${score == null ? "" : " select " + num(score)}</title></circle>` +
      `<text x="${cx}" y="${cy - 9}" fill="${colour}" font-size="11" text-anchor="middle">${esc(m.id)}</text>`;
    const cur = p && p.select ? p.select[m.parent] : null;
    if (cur != null) out += `<line x1="${cx - 9}" x2="${cx + 9}" y1="${y(cur)}" y2="${y(cur)}" stroke="#8c8c8c"><title>${esc(m.parent)} select ${num(cur)}</title></line>`;
  }
  out += `<polyline points="${main.map((p) => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
  for (const p of main)
    out += `<circle cx="${p.x}" cy="${p.y}" r="5.5" fill="${p.adopted || (p.id === "v000" && p.known) ? "#fff" : "#060606"}" stroke="#fff" stroke-width="1.5"/>` +
      `<text x="${p.x + 9}" y="${p.y - 9}" fill="#fff" font-size="12">${esc(p.id)}${p.test != null ? " " + num(p.test) : p.known ? "" : " (not calibrated)"}${p.breakout ? " breakout" : ""}</text>`;
  if (s.iteration) out += `<text x="${x(s.iteration)}" y="${T + 16}" fill="var(--in_progress)" font-size="12" text-anchor="middle" class="pulse">${esc(s.phase)}</text>`;
  $("chart").innerHTML = out;
}

function render(s) {
  if (!s.name) { $("run").innerHTML = "<option>no runs yet</option>"; return; }
  const st = s.state || {};
  const runs = `<option value="">latest (${esc(s.runs[0])})</option>` + s.runs.map((r) => `<option>${esc(r)}</option>`).join("");
  if ($("run").dataset.runs !== runs) { $("run").innerHTML = $("run").dataset.runs = runs; }
  $("run").value = view.get("run") || "";
  const tab = (name, label) => `<button class="tab ${(s.task || "") === name ? "on" : ""}" data-task="${esc(name)}">${label}</button>`;
  const tabs = tab("", "whole run") + s.tasks.map((t) => {
    const best = Math.max(-1, ...t.searches.map((x) => x.score));
    return tab(t.name, esc(t.name) + (t.running ? ` <span class="live">● ${t.running}</span>` : "") + (best >= 0 ? ` ${num(best)}` : ""));
  }).join("");
  if ($("tabs").dataset.tabs !== tabs) { $("tabs").innerHTML = $("tabs").dataset.tabs = tabs; }   // unchanged tabs stay put, so a click lands
  const t = s.tasks.find((x) => x.name === s.task);
  $("about").innerHTML = t ? `<span title="${esc(t.question)}"><b>${esc(t.question)}</b></span>` : "";
  $("about").innerHTML += t ? " · " + (t.searches.map((x) => `${esc(x.method)} ${esc(x.role)}${x.round ? " r" + x.round : ""} <b>${num(x.score)}</b> (${x.correct} correct, ${x.wrong} wrong of ${x.total})`).join(" · ") || "no scored search yet") : "";
  $("phase").textContent = s.phase + (s.iteration ? `, iteration ${s.iteration}` : "");
  $("current").textContent = st.current || "–";
  $("best").textContent = num(st.best_test);
  $("done").textContent = s.searches_done + (s.failed ? `, ${s.failed} failed` : "");
  $("spend").textContent = "$" + num(s.spend, 3);
  $("error").textContent = s.last_error ? `last failure: ${s.last_error}` : "";
  machine(s); agents(s); tree(s); chart(s);
}

async function poll() {
  const r = await fetch(`/api/run?name=${encodeURIComponent(view.get("run") || "")}&task=${encodeURIComponent(view.get("task") || "")}`);
  render(await r.json());
}
$("run").onchange = (e) => choose("run", e.target.value);
$("tabs").onclick = (e) => { const b = e.target.closest(".tab"); if (b) choose("task", b.dataset.task); };
poll();
setInterval(() => poll().catch(() => {}), 500);
</script>
</body>
</html>
